<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101113">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Образовательный сайт</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", Arial, sans-serif; background: #101113; color: #f4f3ef; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 0%, #f9861a12, transparent 55%), #101113; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background-image: linear-gradient(#ffffff03 1px, transparent 1px), linear-gradient(90deg, #ffffff03 1px, transparent 1px); background-size: 64px 64px; mask-image: radial-gradient(ellipse at center, #000, transparent 75%); }
    main { position: relative; width: min(100% - 48px, 880px); padding: 80px 0; }
    nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .btn { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 44px; padding: 32px; overflow: hidden; border: 1px solid #ffffff16; border-radius: 20px; background: linear-gradient(140deg, #ffffff08, #ffffff02); color: #f4f3ef; text-decoration: none; box-shadow: 0 16px 48px #00000018, inset 0 1px #ffffff04; transition: transform .25s, border-color .25s, background .25s, box-shadow .25s; }
    .btn::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at top left, #f9861a15, transparent 70%); opacity: 0; transition: opacity .25s; pointer-events: none; }
    .icon { display: grid; place-items: center; width: 56px; height: 56px; border: 1px solid #f9861a2e; border-radius: 16px; background: #f9861a0c; color: #f9a052; }
    .icon svg { width: 28px; height: 28px; }
    .label { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: clamp(18px, 2.5vw, 23px); font-weight: 500; letter-spacing: -.035em; }
    .arrow { flex-shrink: 0; width: 22px; height: 22px; color: #8b8d91; transition: transform .25s, color .25s; }
    .btn:hover { transform: translateY(-5px); border-color: #f9861a66; box-shadow: 0 24px 64px #00000030; }
    .btn:hover::before { opacity: 1; }
    .btn:hover .arrow { transform: translate(3px, -3px); color: #f9a052; }
    .btn:focus-visible { outline: 2px solid #f9a052; outline-offset: 6px; }
    .btn:active { transform: translateY(-1px); }
    @media (max-width: 640px) { main { width: min(100% - 40px, 420px); padding: 56px 0; } nav { grid-template-columns: 1fr; gap: 14px; } .btn { padding: 24px; gap: 28px; border-radius: 18px; } .label { font-size: 21px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; } .btn:hover, .btn:hover .arrow { transform: none; } }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Образовательные проекты">
      <a class="btn" href="https://typing.dldevs.ru/">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 15h10"/></svg></span>
        <span class="label">Клавогонка<svg class="arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 18 6M6 6h12v12"/></svg></span>
      </a>
      <a class="btn" href="https://sec.dldevs.ru/">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8.5 11.5 2.5 2.5 4.5-5"/></svg></span>
        <span class="label">Кибербезопасность<svg class="arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 18 6M6 6h12v12"/></svg></span>
      </a>
    </nav>
  </main>
</body>
</html>
